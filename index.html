<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1d4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>A Birthday Adventure ✿</title>
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Caveat:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- loading -->
  <div id="loading" class="screen">
    <div class="loader-flower">✿</div>
    <p class="loader-text">Preparing a little world…</p>
    <div class="bar"><div id="load-bar"></div></div>
  </div>

  <!-- title -->
  <div id="title" class="screen hidden">
    <p class="kicker">✿ A Little World Made Just for You ✿</p>
    <h1 id="game-title">Pooja's Birthday Adventure</h1>
    <button id="start-btn" class="btn primary">Start Journey</button>
    <p class="hint">🎧 Best with sound on</p>
    <p class="credit">Made with love by Nilesh</p>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="petal-tracker">
      <div class="petals"></div>
      <span id="petal-count">0 / 5</span>
    </div>
    <div id="objective"></div>
    <div id="hud-buttons">
      <button id="btn-mute" class="icon-btn" title="Mute">🔊</button>
      <button id="btn-quality" class="icon-btn" title="Graphics quality">HQ</button>
      <button id="btn-full" class="icon-btn" title="Fullscreen">⛶</button>
    </div>
    <div id="area-toast"></div>
    <div id="prompt" class="hidden"><kbd>E</kbd><span></span></div>
    <div id="controls-help" class="hidden"></div>
  </div>

  <!-- touch controls -->
  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="btn-jump" class="touch-btn">⤒</button>
    <button id="btn-act" class="touch-btn act">✋</button>
  </div>

  <!-- intro / cinematic captions -->
  <div id="caption"></div>

  <!-- story chapter -->
  <div id="story" class="screen hidden">
    <div class="story-card">
      <p class="chapter-kicker"></p>
      <h2 class="chapter-title"></h2>
      <div class="shayari"></div>
      <button class="btn primary story-next hidden">Continue ✿</button>
    </div>
  </div>

  <!-- finale text layer -->
  <div id="finale" class="hidden">
    <p class="f-lead"></p>
    <h2 class="f-name"></h2>
    <h1 class="f-nick"></h1>
    <div class="f-shayari"></div>
    <h2 class="f-bday"></h2>
    <button id="open-letter" class="btn primary hidden">Open your letter 💌</button>
  </div>

  <!-- letter -->
  <div id="letter" class="screen hidden">
    <div class="paper">
      <h2 class="l-title"></h2>
      <div class="l-body"></div>
      <p class="l-closing"></p>
      <p class="l-sign"></p>
      <div class="l-actions">
        <button id="btn-explore" class="btn">Keep exploring ✿</button>
        <button id="btn-replay" class="btn primary">Replay journey</button>
      </div>
    </div>
  </div>

  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
